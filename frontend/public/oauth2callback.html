<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification Google - Callback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            color: #333;
            margin: 0 0 10px;
        }
        p {
            color: #666;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Authentification en cours...</h2>
        <p>Veuillez patienter, vous allez être redirigé.</p>
    </div>

    <script>
        console.log('OAuth callback page loaded');
        console.log('Current URL:', window.location.href);
        console.log('Window opener exists:', !!window.opener);
        
        // Récupérer le code d'autorisation de l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');
        const state = urlParams.get('state');

        console.log('OAuth Code:', code);
        console.log('OAuth Error:', error);
        console.log('OAuth State:', state);

        if (error) {
            console.error('OAuth Error:', error);
            
            // Afficher l'erreur à l'utilisateur
            document.querySelector('.container').innerHTML = `
                <div style="color: #e53e3e;">
                    <h2>❌ Erreur d'authentification</h2>
                    <p>Erreur: ${error}</p>
                    <p style="margin-top: 20px;">Cette fenêtre va se fermer automatiquement...</p>
                </div>
            `;
            
            // Essayer de communiquer avec la fenêtre parent
            try {
                if (window.opener && !window.opener.closed) {
                    console.log('Sending error to opener...');
                    window.opener.postMessage({
                        type: 'GOOGLE_OAUTH_ERROR',
                        error: error
                    }, '*'); // Use '*' for Electron compatibility
                }
            } catch (e) {
                console.error('Error sending message to opener:', e);
            }
            
            // Fermer après 3 secondes
            setTimeout(() => {
                console.log('Closing window...');
                window.close();
            }, 3000);
            
        } else if (code) {
            console.log('OAuth code received, processing...');
            
            // Afficher le succès
            document.querySelector('.container').innerHTML = `
                <div style="color: #38a169;">
                    <h2>✅ Authentification réussie!</h2>
                    <p>Transmission du code...</p>
                    <p style="margin-top: 20px; font-size: 12px;">Cette fenêtre va se fermer automatiquement.</p>
                </div>
            `;
            
            // Envoyer le code à la fenêtre parent
            try {
                if (window.opener && !window.opener.closed) {
                    console.log('Sending code to opener...', code.substring(0, 10) + '...');
                    window.opener.postMessage({
                        type: 'GOOGLE_OAUTH_SUCCESS',
                        code: code,
                        state: state
                    }, '*'); // Use '*' for Electron compatibility
                    console.log('Message sent successfully');
                } else {
                    console.warn('Window opener not available or closed');
                }
            } catch (e) {
                console.error('Error sending message to opener:', e);
            }
            
            // Fermer la fenêtre après un délai pour laisser le temps au message d'être traité
            setTimeout(() => {
                console.log('Closing window...');
                window.close();
            }, 2000);
            
        } else {
            console.warn('No code or error found in URL');
            
            // Aucun code ni erreur - page invalide
            document.querySelector('.container').innerHTML = `
                <div style="color: #ed8936;">
                    <h2>⚠️ Aucune donnée d'authentification</h2>
                    <p>URL invalide ou incomplète.</p>
                    <p style="margin-top: 20px;">Cette fenêtre va se fermer...</p>
                </div>
            `;
            
            setTimeout(() => {
                window.close();
            }, 2000);
        }
    </script>
</body>
</html>
